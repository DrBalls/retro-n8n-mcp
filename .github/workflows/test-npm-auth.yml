name: Test NPM Authentication

on:
  workflow_dispatch:

jobs:
  test-auth:
    name: Test NPM Token
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Test NPM Authentication
        run: |
          # This will verify the token without publishing anything
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Check Package Access
        run: |
          # Check if we can access the package name
          npm view @retro/n8n-mcp-server || echo "Package not yet published (this is normal for first release)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}