name: CI

on:
  push:
    branches: [ master, production ]
  pull_request:
    branches: [ master, production ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck
      
      - name: Build project
        run: npm run build
      
      - name: Verify build output
        run: |
          echo "✅ Checking build output..."
          ls -la dist/
          
          # Verify main entry point exists
          if [ ! -f "dist/index.js" ]; then
            echo "❌ Build failed: dist/index.js not found"
            exit 1
          fi
          
          echo "✅ Build successful!"

  validate-production:
    name: Validate Production Branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production' || github.base_ref == 'production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for development files
        run: |
          echo "🔍 Checking for development files that shouldn't be in production..."
          
          DEV_FILES=(
            ".roo"
            ".taskmaster"
            ".cursor"
            "CLAUDE.md"
            "coverage"
            "tests"
            ".eslintrc.json"
            ".prettierrc.json"
          )
          
          FOUND_FILES=()
          for file in "${DEV_FILES[@]}"; do
            if [ -e "$file" ]; then
              FOUND_FILES+=("$file")
            fi
          done
          
          if [ ${#FOUND_FILES[@]} -gt 0 ]; then
            echo "❌ Found development files in production branch:"
            printf '%s\n' "${FOUND_FILES[@]}"
            exit 1
          fi
          
          echo "✅ Production branch is clean!"