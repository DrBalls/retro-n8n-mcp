name: CI Minimal

on:
  push:
    branches: [ master, production ]
  pull_request:
    branches: [ master, production ]
  workflow_dispatch:

jobs:
  verify-setup:
    name: Verify Setup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Verify project structure
        run: |
          echo "✅ Checking project structure..."
          
          # Check required files exist
          for file in "package.json" "tsconfig.json" "README.md" "LICENSE"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          
          # Check source directory
          if [ ! -d "src" ]; then
            echo "❌ Missing src directory"
            exit 1
          fi
          
          # Count tools
          TOOL_COUNT=$(find src/tools -name "*.ts" -not -name "*.test.ts" -not -name "index.ts" | wc -l)
          echo "📊 Found $TOOL_COUNT tools"
          
          echo "✅ Project structure verified!"

  validate-production:
    name: Validate Production Branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for development files
        run: |
          echo "🔍 Checking production branch..."
          
          DEV_FILES=(".roo" ".taskmaster" "CLAUDE.md" "coverage" "tests")
          
          for file in "${DEV_FILES[@]}"; do
            if [ -e "$file" ]; then
              echo "❌ Found development file in production: $file"
              exit 1
            fi
          done
          
          echo "✅ Production branch is clean!"